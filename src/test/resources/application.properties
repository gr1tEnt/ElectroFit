# Prevent loading developer .env during automated tests.
spring.config.import=
spring.datasource.url=jdbc:h2:mem:electrofit_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

JWT_SECRET=test-jwt-secret-for-automated-tests-only-32chars
JWT_EXPIRATION_MS=3600000
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

app.cors.allowed-origins=http://localhost:3000
app.product-images.upload-dir=${java.io.tmpdir}/electrofit-test-uploads
app.seed.enabled=false
