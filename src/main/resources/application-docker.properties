# Docker Compose profile — PostgreSQL service hostname: db

spring.datasource.url=jdbc:postgresql://db:5432/electrofit
spring.datasource.username=postgres
spring.datasource.password=postgres

# Auto-create/update missing tables and columns on startup (local & production).
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

app.jwt.secret=electrofit-docker-jwt-secret-change-in-production-min-32-chars
app.jwt.expiration-ms=86400000

app.product-images.upload-dir=/app/uploads/products

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

app.contact.email=${CONTACT_EMAIL:electrofit.support@gmail.com}
app.mail.from-name=ElectroFit
