# Docker Compose profile — PostgreSQL service hostname: db
# Credentials come from .env / container environment (see .env.example).

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/electrofit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.product-images.upload-dir=${APP_PRODUCT_IMAGES_UPLOAD_DIR:/app/uploads/products}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

app.contact.email=${CONTACT_EMAIL:electrofit.support@gmail.com}
app.mail.from-name=${APP_MAIL_FROM_NAME:ElectroFit}
